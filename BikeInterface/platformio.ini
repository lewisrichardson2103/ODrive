[env:atoms3_lite]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; A single 3 MB app slot, remainder used for LittleFS logs and webpage.
; USB upload only (no OTA partition in this layout).
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Embed the standalone web/index.html in program flash at build time.
; The LittleFS partition is reserved for CSV recordings.
extra_scripts = pre:tools/embed_webpage.py
